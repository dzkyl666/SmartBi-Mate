# ============================================================

extra_tool_use_rule: |
  - 调用工具时尽量提供合适的参数
  - 使用中文描述业务问题，但生成的 SQL 必须是标准 MySQL 语法
  - 当用户问到"客单价""AOV"等术语时，自动展开为对应计算公式

table_selection_extra_rule: |
  - 涉及订单金额、销量、客单价的问题 → 必须选 fact_order
  - 涉及地区筛选（华东/华南等）→ 关联 dim_region
  - 涉及品类、品牌、价格 → 关联 dim_product
  - 涉及会员等级、年龄、性别 → 关联 dim_user
  - 环比/同比问题需要同时取两个时间段的数据做对比

text2sql_extra_rule: |
  - 使用标准 MySQL 语法，不要用 Presto/Trino 函数
  - 日期字段用 DATE() / YEAR() / MONTH() 函数处理
  - 金额计算注意精度：ROUND(..., 2)
  - JOIN 时使用明确的 ON 条件，不要用隐式连接
  - 折扣率 discount 是 0~1 的小数，实付金额 = order_amount * (1 - discount)
  - 已取消和退款中的订单 pay_date 为 NULL，统计销售额时只算 order_status='已完成'

basic_knowledge_glossary: |
  # 电商业务系统术语表

  ## 系统概述
  你正在回答一个中文电商数据分析平台的问题。该系统管理订单、商品、用户、地区四个维度的数据，
  支持销售额分析、用户画像、商品排行、地区分布等业务场景。

  ## 数据时间范围（重要）
  - **当前演示数据库的订单数据只覆盖 2024-01-01 至 2024-12-31**，没有其它年份的数据。
  - 当用户询问"今年""全年""6月和7月"等**相对时间**时，不要照抄系统当前日期，
    应理解为上文提到的那一年、或数据实际覆盖的 2024 年；若相对时间与数据范围发生冲突，
    以数据实际覆盖的时间为准，并注意不要为了取理想年份去查空表。

  ## 核心业务概念

  **订单相关：**
  - 订单金额（order_amount）= 数量 × 成交单价
  - 实付金额（pay_amount）= 订单金额 × (1 - 折扣率)
  - 客单价 / AOV = SUM(pay_amount) / COUNT(DISTINCT order_id)，仅统计已完成订单
  - 订单状态：已完成 / 已取消 / 退款中
  - 统计销售额时**只算 order_status='已完成'** 的订单

  **商品相关：**
  - 品类（category）：服饰 / 数码 / 食品 / 家居 / 美妆 / 运动 / 图书
  - 毛利率 = (unit_price - cost_price) / unit_price
  - SKU 即 product_id

  **用户相关：**
  - 会员等级：普通 / 银卡 / 金卡 / 钻石
  - 复购率 = 下单≥2次的用户数 / 总下单用户数
  - **当结果涉及"用户"时（客单价 topN、用户排名、用户画像等），务必 JOIN dim_user 并返回 user_name（用户名），不要只返回 user_id**

  **地区相关：**
  - 七大区：华东 / 华南 / 华北 / 华中 / 西南 / 西北 / 东北
  - 每个地区下有多个省份和城市

  ## 常用派生指标
  - 客单价(AOV): SUM(pay_amount) / COUNT(DISTINCT order_id) WHERE order_status='已完成'
  - 件单价: SUM(pay_amount) / SUM(quantity) WHERE order_status='已完成'
  - 折扣力度: AVG(discount) WHERE discount > 0
  - 月环比增长率: (本月值 - 上月值) / 上月值 × 100%
  - 同比增长率: (今年值 - 去年值) / 去年值 × 100%

  ## 派生指标的 SQL 生成铁律（极其重要）
  - 当问题问的是「增长率 / 环比 / 同比 / 占比 / 比率 / 增速」这类**派生指标**时，
    你必须在**同一条 SQL 里完成计算并直接输出结果值**，例如用
    `SUM(CASE WHEN ... THEN 值 END)` 分别取两个时期再相除、或用子查询 + LAG/窗口函数。
  - **绝对禁止**只 `SELECT ... GROUP BY 月份` 把两个时期的原始销售额分别查出来就算完事——
    那样等于没回答问题。用户要的是「增长率」这一个数字或一列增长率的表，不是两个原始值。
  - 环比公式：(本月 - 上月) / 上月 × 100%；同比公式：(今年 - 去年) / 去年 × 100%。

  ## 业务规则
  - 一个用户可以有多个订单
  - 一个订单只包含一种商品（简化模型）
  - 6月和11月是大促月份，折扣力度较大
  - 已取消/退款中的订单不计入销售额统计
